<!doctype html>
<html lang="ru">
<head>
  <script>
    (() => {
      const theme = localStorage.getItem('ui_theme') || 'dark';
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Конструктор устройств и программ</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="container constructor-page">
    <header class="page-header">
      <div>
        <nav class="page-nav">
          <a href="/">Лампы</a>
          <a href="/manipulator">Манипулятор</a>
          <a href="/constructor" class="active">Конструктор</a>
        </nav>
        <h1>Конструктор устройств и программ</h1>
        <p class="hint">Собирайте сценарии, где шаги для разных устройств выполняются последовательно.</p>
      </div>
      <div class="header-actions">
        <button type="button" class="btn" data-settings-open>Настройки</button>
        <div class="status-pill" id="constructor-status">Готово</div>
      </div>
    </header>

    <section class="layout-two-columns">
      <section class="card">
        <h2>Шаг сценария</h2>
        <form id="scenario-step-form" class="program-form">
          <div class="builder-grid">
            <label>
              Тип устройства
              <select id="step-device-type">
                <option value="lamp">Лампа</option>
                <option value="manipulator">Манипулятор</option>
                <option value="wait">Ожидание</option>
              </select>
            </label>
            <label>
              Устройство
              <select id="step-target"></select>
            </label>
            <label>
              Действие
              <select id="step-action"></select>
            </label>
          </div>

          <div id="step-fields" class="builder-grid"></div>

          <div class="builder-grid">
            <label>
              Задержка после шага, сек
              <input id="step-delay" type="number" min="0" step="0.1" value="0" />
            </label>
          </div>

          <div class="buttons top-gap">
            <button type="submit" class="btn">Добавить шаг</button>
            <button type="button" id="clear-steps" class="btn off">Очистить шаги</button>
          </div>
        </form>
      </section>

      <section class="card">
        <h2>Сохранение программы</h2>
        <div class="program-form">
          <div class="builder-grid">
            <label>
              Имя программы
              <input id="scenario-name" type="text" placeholder="Например: манипулятор+лампы" />
            </label>
            <label>
              Сохранённые программы
              <select id="saved-scenarios"></select>
            </label>
          </div>
          <div class="buttons top-gap">
            <button type="button" id="save-scenario" class="btn">Сохранить</button>
            <button type="button" id="delete-scenario" class="btn off">Удалить</button>
          </div>
          <div class="buttons top-gap">
            <button type="button" id="run-scenario" class="btn green">Запустить сценарий</button>
            <button type="button" id="stop-scenario" class="btn off">Стоп</button>
          </div>
          <p id="constructor-result" class="action-result"></p>
        </div>
      </section>
    </section>

    <section class="card">
      <h2>Шаги сценария</h2>
      <div id="scenario-steps" class="program-list"></div>
      <pre id="scenario-json-preview"></pre>
    </section>
  </main>
  <div id="global-settings-modal" class="settings-modal hidden" role="dialog" aria-modal="true" aria-labelledby="settings-modal-title">
    <div class="settings-modal-backdrop" data-settings-close></div>
    <div class="settings-modal-card">
      <div class="section-row">
        <h2 id="settings-modal-title">Общие настройки</h2>
        <button type="button" class="btn off" data-settings-close>Закрыть</button>
      </div>
      <form id="global-settings-form" class="program-form">
        <div class="builder-grid">
          <label>Тема
            <select id="settings-theme">
              <option value="dark">Тёмная</option>
              <option value="light">Светлая</option>
            </select>
          </label>
          <label>Server host<input id="settings-server-host" type="text" required /></label>
          <label>Server port<input id="settings-server-port" type="number" min="1" max="65535" required /></label>
          <label>UDP host<input id="settings-udp-host" type="text" required /></label>
          <label>UDP port<input id="settings-udp-port" type="number" min="1" max="65535" required /></label>
          <label>Manipulator host<input id="settings-manip-host" type="text" required /></label>
          <label>Manipulator port<input id="settings-manip-port" type="number" min="1" max="65535" required /></label>
          <label>Manipulator protocol
            <select id="settings-manip-protocol"><option value="udp">UDP</option><option value="tcp">TCP</option></select>
          </label>
        </div>
        <div class="buttons top-gap">
          <button type="submit" class="btn">Сохранить</button>
        </div>
        <p class="hint" id="settings-save-hint"></p>
      </form>
    </div>
  </div>


  <script src="/static/theme.js"></script>
  <script src="/static/constructor.js"></script>
  <script src="/static/settings-menu.js"></script>
</body>
</html>
