<!doctype html>
<html lang="ru">
<head>
  <script>
    (() => {
      const theme = localStorage.getItem('ui_theme') || 'dark';
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Конструктор устройств и программ</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="container constructor-page">
    <header class="page-header">
      <div>
        <nav class="page-nav">
          <a href="/">Лампы</a>
          <a href="/manipulator">Манипулятор</a>
          <a href="/constructor" class="active">Конструктор</a>
        </nav>
        <h1>Конструктор устройств и программ</h1>
        <p class="hint">Собирайте сценарии, где шаги для разных устройств выполняются последовательно.</p>
      </div>
      <div class="header-actions">
        <button type="button" class="btn theme-toggle" data-theme-toggle>Светлая тема</button>
        <div class="status-pill" id="constructor-status">Готово</div>
      </div>
    </header>

    <section class="layout-two-columns">
      <section class="card">
        <h2>Шаг сценария</h2>
        <form id="scenario-step-form" class="program-form">
          <div class="builder-grid">
            <label>
              Тип устройства
              <select id="step-device-type">
                <option value="lamp">Лампа</option>
                <option value="manipulator">Манипулятор</option>
              </select>
            </label>
            <label>
              Устройство
              <select id="step-target"></select>
            </label>
            <label>
              Действие
              <select id="step-action"></select>
            </label>
          </div>

          <div id="step-fields" class="builder-grid"></div>

          <div class="builder-grid">
            <label>
              Задержка после шага, сек
              <input id="step-delay" type="number" min="0" step="0.1" value="0" />
            </label>
          </div>

          <div class="buttons top-gap">
            <button type="submit" class="btn">Добавить шаг</button>
            <button type="button" id="clear-steps" class="btn off">Очистить шаги</button>
          </div>
        </form>
      </section>

      <section class="card">
        <h2>Сохранение программы</h2>
        <div class="program-form">
          <div class="builder-grid">
            <label>
              Имя программы
              <input id="scenario-name" type="text" placeholder="Например: манипулятор+лампы" />
            </label>
            <label>
              Сохранённые программы
              <select id="saved-scenarios"></select>
            </label>
          </div>
          <div class="buttons top-gap">
            <button type="button" id="save-scenario" class="btn">Сохранить</button>
            <button type="button" id="delete-scenario" class="btn off">Удалить</button>
          </div>
          <div class="buttons top-gap">
            <button type="button" id="run-scenario" class="btn green">Запустить сценарий</button>
            <button type="button" id="stop-scenario" class="btn off">Стоп</button>
          </div>
          <p id="constructor-result" class="action-result"></p>
        </div>
      </section>
    </section>

    <section class="card">
      <h2>Шаги сценария</h2>
      <div id="scenario-steps" class="program-list"></div>
      <pre id="scenario-json-preview"></pre>
    </section>
  </main>

  <script src="/static/theme.js"></script>
  <script src="/static/constructor.js"></script>
</body>
</html>
